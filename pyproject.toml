[project]
name = "transformer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.1",
    "pydantic>=2.13.5",
    "tokenizers>=0.23.1",
    "torch>=2.13.0",
]

[project.scripts]
attention-is-all-you-need = "transformer.main:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# __init__.py files are re-export barrels; the imports are the public API, not dead code.
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "single"
